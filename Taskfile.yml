version: "3"

vars:
  SVU: svu
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  EXE: '{{if eq OS "windows"}}envbuckets.exe{{else}}envbuckets{{end}}'

tasks:
  build:
    desc: Build the envbuckets binary for this platform.
    cmds:
      - go build -trimpath -o {{.EXE}} .

  fmt:
    desc: Format Go code (gofumpt + goimports via golangci-lint).
    cmds:
      - task: lint:version
      - golangci-lint fmt ./...

  lint:version:
    internal: true
    preconditions:
      - sh: command -v golangci-lint
        msg: 'golangci-lint is missing; install {{.GOLANGCI_LINT_VERSION}}'
      - sh: 'test "v$(golangci-lint version --short)" = "{{.GOLANGCI_LINT_VERSION}}"'
        msg: 'installed golangci-lint differs from Taskfile.yml; install {{.GOLANGCI_LINT_VERSION}}'
      # Use shell builtins so this also works on Windows without grep on PATH.
      - sh: |
          cr=$(printf '\r')
          while IFS= read -r line; do
            test "${line%"$cr"}" != '  GOLANGCI_LINT_VERSION: {{.GOLANGCI_LINT_VERSION}}' || exit 0
          done < .github/workflows/ci.yml
          exit 1
        msg: 'ci.yml must pin GOLANGCI_LINT_VERSION to {{.GOLANGCI_LINT_VERSION}}, matching Taskfile.yml'
      # Check the advisory scanner's CI pin without requiring its local binary.
      - sh: |
          cr=$(printf '\r')
          while IFS= read -r line; do
            test "${line%"$cr"}" != '  GOVULNCHECK_VERSION: {{.GOVULNCHECK_VERSION}}' || exit 0
          done < .github/workflows/ci.yml
          exit 1
        msg: 'ci.yml must pin GOVULNCHECK_VERSION to {{.GOVULNCHECK_VERSION}}, matching Taskfile.yml'
    cmds:
      - 'true'

  fix:
    desc: Format Go code and apply automatic lint fixes; review the diff afterwards.
    cmds:
      - task: lint:version
      - golangci-lint fmt ./...
      - golangci-lint run --fix ./...

  lint:go:
    desc: Lint Go code and fail if formatting differs.
    cmds:
      - task: lint:version
      - golangci-lint fmt --diff ./...
      - golangci-lint run ./...

  lint:
    desc: Check Go lint and formatting, JSON formatting, and config schema validation.
    cmds:
      - task: lint:go
      - pnpm --config.verifyDepsBeforeRun=false exec oxfmt --check schema/envbuckets.schema.json schema/testdata/invalid/*.json tools/validate-config-schema.mjs package.json
      - pnpm --config.verifyDepsBeforeRun=false run validate:schema

  security:version:
    internal: true
    preconditions:
      - sh: command -v govulncheck
        msg: 'govulncheck is missing; run go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}'
      # Inspect the embedded module version without contacting the vulnerability DB.
      - sh: |
          go version -m "$(command -v govulncheck)" | {
            while read -r kind module version rest; do
              if test "$kind" = mod; then
                test "$module" = golang.org/x/vuln && test "$version" = '{{.GOVULNCHECK_VERSION}}'
                exit $?
              fi
            done
            exit 1
          }
        msg: 'installed govulncheck differs from Taskfile.yml; install {{.GOVULNCHECK_VERSION}}'
      # Match EB-08's LF/CRLF-safe CI pin guard.
      - sh: |
          cr=$(printf '\r')
          while IFS= read -r line; do
            test "${line%"$cr"}" != '  GOVULNCHECK_VERSION: {{.GOVULNCHECK_VERSION}}' || exit 0
          done < .github/workflows/ci.yml
          exit 1
        msg: 'ci.yml must pin GOVULNCHECK_VERSION to {{.GOVULNCHECK_VERSION}}, matching Taskfile.yml'
    cmds:
      - 'true'

  security:
    desc: Check reachable Go vulnerabilities (advisory in CI, separate from check).
    cmds:
      - task: security:version
      - govulncheck ./...

  test:
    desc: Run Go unit tests.
    cmds:
      - go test -shuffle=on ./...

  test:integration:
    desc: Run the txtar scripts against real git (needs symlink support; use WSL on Windows).
    cmds:
      - go test -tags integration -shuffle=on -run TestScript -count=1 .

  pattern:fixture:
    desc: Regenerate recorded Git branch-pattern answers.
    env:
      UPDATE_GIT_FIXTURE: "1"
      GOCACHE: '{{.ROOT_DIR}}/tmp/gocache'
    cmds:
      - go test -run TestGitFixture ./internal/pattern

  check:
    desc: Run lint, unit tests, and real-git integration tests.
    env:
      GOCACHE: '{{.ROOT_DIR}}/tmp/gocache'
    cmds:
      - task: lint
      - task: test
      - task: test:integration

  snapshot:
    desc: Validate config, cross-compile all targets, lay out npm packages. No tag, no publish.
    cmds:
      - goreleaser check
      - goreleaser release --snapshot --clean
      - go run ./tools/npmpkg

  playground:
    desc: Build a snapshot and install its npm packages in ./playground (gitignored).
    deps: [snapshot]
    cmds:
      - rm -rf playground/.packs playground/node_modules playground/package-lock.json
      - mkdir -p playground/.packs
      - cd npm/dist/envbuckets && npm pack --silent --pack-destination ../../../playground/.packs
      - cd npm/dist/@envbuckets/$(node -p "process.platform+'-'+process.arch") && npm pack --silent --pack-destination ../../../../playground/.packs
      - cd playground && (test -f package.json || npm init -y >/dev/null)
      - cd playground && npm install --no-audit --no-fund ./.packs/*.tgz
      - cd playground && npx envbuckets --version

  next-version:
    desc: Show what the next release would be tagged. PRE=alpha|beta|rc for a prerelease.
    cmds:
      - "{{.SVU}} current"
      - "{{if .PRE}}{{.SVU}} prerelease --prerelease {{.PRE}}{{else}}{{.SVU}} next{{end}}"

  release:
    desc: Trigger the release workflow on GitHub. PRE=alpha|beta|rc for a prerelease, VERSION=vX.Y.Z to override.
    preconditions:
      - sh: '[ -z "{{.PRE}}" ] || [ "{{.PRE}}" = alpha ] || [ "{{.PRE}}" = beta ] || [ "{{.PRE}}" = rc ]'
        msg: PRE must be alpha, beta, or rc
    cmds:
      - gh workflow run release.yml --ref main -f prerelease={{.PRE | default "none"}} -f version={{.VERSION}}
      - gh run watch --exit-status $(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')

  clean:
    desc: Remove local build, release, and benchmark outputs.
    cmds:
      - rm -rf dist npm/dist tmp envbuckets envbuckets.exe
