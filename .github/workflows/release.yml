name: release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Prerelease channel
        type: choice
        default: none
        options: [none, alpha, beta, rc]
      version:
        description: Explicit version (vX.Y.Z), overrides svu
        type: string
        default: ""

permissions:
  contents: read

env:
  SVU_VERSION: v3.4.1
  GORELEASER_VERSION: v2.18.1
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  NPM_VERSION: 11.21.0

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'sanketvgh/envbuckets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # zizmor: ignore[artipacked] needs the token to push the tag
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g "npm@${NPM_VERSION}" # zizmor: ignore[adhoc-packages] trusted publishing needs npm >= 11.5.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install release check tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: task check
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
      - name: Check Go vulnerabilities before tagging
        run: govulncheck ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - run: go run ./tools/npmpkg
      - name: Smoke-test packed npm snapshot before tagging
        run: node tools/npm-smoke.mjs
      - name: Verify editor schema is available on main
        run: |
          mkdir -p tmp/release
          curl --fail --silent --show-error https://raw.githubusercontent.com/sanketvgh/envbuckets/main/schema/envbuckets.schema.json -o tmp/release/envbuckets.schema.json
          cmp schema/envbuckets.schema.json tmp/release/envbuckets.schema.json

      - name: Install svu
        run: go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          current="$(svu current)"
          if [ -n "$INPUT_VERSION" ]; then
            tag="$INPUT_VERSION"
          elif [ "$INPUT_PRERELEASE" != "none" ]; then
            tag="$(svu prerelease --prerelease "$INPUT_PRERELEASE")"
          else
            tag="$(svu next)"
          fi
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' \
            || { echo "invalid version: $tag"; exit 1; }
          [ "$tag" != "$current" ] || { echo "nothing to release since $current"; exit 1; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "tag $tag exists"; exit 1; }
          echo "$current -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      - name: Lay out npm packages
        run: |
          mkdir -p npm/dist
          go run ./tools/npmpkg | tee npm/dist/packages.txt

      - name: Publish to npm
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          v="$(jq -r .version dist/metadata.json)"
          test "v$v" = "$TAG" || { echo "metadata version $v != tag $TAG"; exit 1; }
          case "$v" in
            *-alpha.*) channel=alpha ;;
            *-beta.*)  channel=beta ;;
            *-rc.*)    channel=rc ;;
            *)         channel=latest ;;
          esac
          tag="$channel"
          if [ "$channel" != latest ] && ! npm view envbuckets dist-tags.latest 2>/dev/null | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "no stable release yet; publishing $v as latest"
            tag=latest
          fi
          echo "publishing $v under dist-tag $tag"
          while read -r name; do
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "skip $name@$v (already published)"; continue
            fi
            npm publish "npm/dist/$name" --access public --provenance --tag "$tag"
          done < npm/dist/packages.txt

  cleanup:
    needs: release
    if: failure() && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # zizmor: ignore[artipacked] needs the token to push the tag
      - name: Delete dangling tag and release
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || git push --delete origin "$TAG" || true
