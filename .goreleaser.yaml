version: 2

project_name: envbuckets

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  header: |
    ## envbuckets {{ .Version }}
    {{- if .Prerelease }}

    > [!WARNING]
    > This is a prerelease under active development. Expect breaking changes.
    {{- end }}

    Install or update:

    ```sh
    npm install -g envbuckets@{{ .Version }}
    ```
  footer: |
    ---

    **Full Changelog**: https://github.com/sanketvgh/envbuckets/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^.*?(docs|chore|ci|style|test|build)(\\(.*\\))?!?:"
  groups:
    - title: Breaking changes
      regexp: "^.*?[a-z]+(\\(.*\\))?!:"
      order: 0
    - title: Features
      regexp: "^.*?feat(\\(.*\\))?:"
      order: 1
    - title: Bug fixes
      regexp: "^.*?fix(\\(.*\\))?:"
      order: 2
    - title: Other
      order: 999
